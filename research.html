<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
:root {
    --header-safe-top: 120px;
    --blue: #7dd3fc;
    --violet: #a78bfa;
    --acid: #d9ff5a;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: transparent !important;
    color: white;
    font-family: 'Playfair Display', serif;
    overflow-y: auto;
    overflow-x: hidden;
}

.progress {
    position: fixed;
    left: 0;
    top: 0;
    height: 2px;
    width: 0%;
    background: linear-gradient(90deg, var(--blue), var(--violet), var(--acid));
    z-index: 50;
}

.vertical-marquee {
    position: fixed;
    left: 0;
    top: 0;
    width: clamp(150px, 16vw, 260px);
    height: 100vh;
    z-index: 6;
    overflow: hidden;
    pointer-events: none;

    opacity: 0;
    transform: translateY(24px);
    filter: blur(8px);
}

.vertical-marquee.reveal {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
    transition:
        opacity 1.4s ease,
        transform 1.4s ease,
        filter 1.4s ease;
}

.vertical-marquee-track {
    position: absolute;
    left: clamp(20px, 2.6vw, 42px);
    top: 0;
    display: flex;
    flex-direction: column;
    gap: 6vh;
    will-change: transform;
}

.vertical-marquee span {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    white-space: nowrap;
    font-size: clamp(48px, 7vw, 102px);
    line-height: .95;
    letter-spacing: -.045em;
    font-weight: 600;
    color: rgba(255,255,255,.88);
    transform: translateZ(0);
    -webkit-font-smoothing: antialiased;
    mix-blend-mode: screen;
}

.vertical-marquee span strong {
    color: transparent;
    -webkit-text-stroke: 1.35px rgba(255,255,255,.84);
    text-stroke: 1.35px rgba(255,255,255,.84);
}

.vertical-marquee::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: rgba(0,0,0,.55);
    -webkit-mask-image: linear-gradient(
        90deg,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.85) 28%,
        rgba(0,0,0,.35) 52%,
        rgba(0,0,0,.08) 72%,
        rgba(0,0,0,0) 100%
    );
    mask-image: linear-gradient(
        90deg,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,.85) 28%,
        rgba(0,0,0,.35) 52%,
        rgba(0,0,0,.08) 72%,
        rgba(0,0,0,0) 100%
    );
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

main {
    min-height: 100vh;
    padding: var(--header-safe-top, 120px) 40px 60px 15vw;
    box-sizing: border-box;
}

h1 {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
}

.intro {
    max-width: 780px;
    margin: 0 auto 25px;
    text-align: center;
    line-height: 1.6;
    opacity: 0;
    transform: translateY(24px) scale(.98);
    filter: blur(8px);
    font-size: 18px;
}

.research-scene {
    position: relative;
    max-width: 1050px;
    height: min(60vh, 620px);
    min-height: 430px;
    margin: auto;
    border-radius: 30px;
    background: radial-gradient(circle at center, #0f172a 0%, #020617 70%);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(10px);
    overflow: hidden;
    transition: box-shadow 0.8s ease;
    opacity: 0;
    transform: translateY(24px) scale(.98);
    filter: blur(8px);
}

.research-scene.reveal,
.intro.reveal {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
    transition:
        opacity 1.4s ease,
        transform 1.4s ease,
        filter 1.4s ease;
}

.research-scene.focus-mode {
    box-shadow:
        0 0 80px rgba(90,170,255,0.35),
        inset 0 0 80px rgba(90,170,255,0.12);
}

#vinyl-3d {
    width: 100%;
    height: 100%;
    cursor: grab;
}

#vinyl-3d:active {
    cursor: grabbing;
}

#vinyl-3d canvas {
    touch-action: none;
}

#scene-fade {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 18%, rgba(0,0,0,0.95) 100%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease;
    z-index: 10;
}

#researchTooltip {
    position: fixed;
    max-width: 280px;
    padding: 13px 16px;
    border-radius: 16px;
    background: rgba(0,0,0,0.82);
    border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(12px);
    box-shadow:
        0 18px 40px rgba(0,0,0,0.45),
        0 0 22px rgba(90,170,255,0.2);
    color: white;
    font-size: 13px;
    line-height: 1.45;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -120%);
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 9999;
}

@media (max-width: 900px) {
    .vertical-marquee {
        width: 82px;
        opacity: .36;
    }

    .vertical-marquee-track {
        left: 12px;
    }

    .vertical-marquee span {
        font-size: clamp(48px, 15vw, 62px);
    }

    main {
        padding: var(--header-safe-top, 120px) 18px 42px 78px;
    }

    .intro {
        font-size: 16px;
        line-height: 1.55;
        margin-bottom: 22px;
        text-align: left;
    }

    .research-scene {
        height: 58vh;
        min-height: 360px;
        border-radius: 24px;
    }
}

@media (max-width: 520px) {
    .vertical-marquee {
        width: 58px;
        opacity: .25;
    }

    .vertical-marquee-track {
        left: 7px;
    }

    .vertical-marquee span {
        font-size: 44px;
    }

    main {
        padding: var(--header-safe-top, 120px) 12px 34px 58px;
    }

    .intro {
        font-size: 15px;
        margin-bottom: 18px;
    }

    .research-scene {
        height: 56vh;
        min-height: 320px;
        border-radius: 20px;
    }

    #researchTooltip {
        display: none;
    }
}

</style>
</head>

<body>

<div class="progress" id="progress"></div>

<div class="vertical-marquee" aria-hidden="true">
    <div class="vertical-marquee-track">
        <span><strong>Recherche</strong> & exploration</span>
        <span><strong>Recherche</strong> & exploration</span>
        <span><strong>Recherche</strong> & exploration</span>
        <span><strong>Recherche</strong> & exploration</span>
        <span><strong>Recherche</strong> & exploration</span>
        <span><strong>Recherche</strong> & exploration</span>
    </div>
</div>

<main>
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>

    <div class="research-scene">
        <div id="vinyl-3d"></div>
        <div id="scene-fade"></div>
    </div>
</main>

<div id="researchTooltip"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const container = document.getElementById("vinyl-3d");
const fadeOverlay = document.getElementById("scene-fade");
const researchScene = document.querySelector(".research-scene");
const researchTooltip = document.getElementById("researchTooltip");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35,
    container.clientWidth / container.clientHeight,
    0.1,
    1000
);

camera.position.set(0, 0.6, 6.5);

const initialCameraPosition = new THREE.Vector3(0, 0.6, 6.5);
const initialControlsTarget = new THREE.Vector3(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
});

renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.enablePan = false;
controls.enableZoom = true;
controls.rotateSpeed = 1.85;
controls.zoomSpeed = 1.65;
controls.minDistance = 0.8;
controls.maxDistance = 9;
controls.target.copy(initialControlsTarget);
controls.update();

renderer.domElement.addEventListener("wheel", (event) => {
    event.preventDefault();

    const zoomFactor = event.deltaY > 0 ? 1.08 : 0.92;

    camera.position.sub(controls.target);
    camera.position.multiplyScalar(zoomFactor);
    camera.position.add(controls.target);

    camera.position.clampLength(controls.minDistance, controls.maxDistance);
}, { passive: false });

renderer.domElement.style.touchAction = "none";

scene.add(new THREE.AmbientLight(0xffffff, 3));

const keyLight = new THREE.DirectionalLight(0xffffff, 4);
keyLight.position.set(4, 6, 5);
scene.add(keyLight);

const blueLight = new THREE.PointLight(0x6aa8ff, 2.5, 10);
blueLight.position.set(-3, 2, 3);
scene.add(blueLight);

const mainGroup = new THREE.Group();
scene.add(mainGroup);

let studio = null;
let hoveredMesh = null;
let isFocusing = false;

const allModelMeshes = [];
const clickableMeshes = [];

const focusPoint = new THREE.Vector3();
const focusCameraPosition = new THREE.Vector3();
let focusUrl = "";

const DEBUG_MESH_PICKER = false;

const interactableMeshesConfig = {
    "Object_88": {
        name: "Echange sur le Technical Death Metal",
        url: "https://www.youtube.com/watch?v=ihkFPNU_wzw",
        cameraOffset: new THREE.Vector3(0, 0.12, 0.65)
    },

    "Object_217": {
        name: "Ethnomusicologie - Le Rap en Afrique",
        url: "https://jeanrevo.github.io/portfolio_M1/assets/pdf/ethnomusicologie-rap-en-afrique.pdf",
        cameraOffset: new THREE.Vector3(0, 0.12, 0.65)
    },

    "Object_71": {
        name: "Recherche et Analyse - Gorod (Death Metal)",
        url: "https://jeanrevo.github.io/portfolio_M1/assets/pdf/recherche-gorod.pdf",
        cameraOffset: new THREE.Vector3(0, 0.12, 0.65)
    },

        "Object_199": {
        name: "Le Studio - Chatbot d'écoute musicale",
        url: "listening-chatbot.html",
        cameraOffset: new THREE.Vector3(0, 0.12, 0.65)
    }
};

function forEachMaterial(mesh, callback) {
    if (!mesh.material) return;

    if (Array.isArray(mesh.material)) {
        mesh.material.forEach(callback);
    } else {
        callback(mesh.material);
    }
}

function cloneMaterial(mesh) {
    if (!mesh.material || mesh.userData.materialCloned) return;

    if (Array.isArray(mesh.material)) {
        mesh.material = mesh.material.map(material => material.clone());
    } else {
        mesh.material = mesh.material.clone();
    }

    mesh.userData.materialCloned = true;
}

function prepareMeshForHover(mesh) {
    cloneMaterial(mesh);

    if (mesh.userData.originalMaterialsState) return;

    mesh.userData.originalMaterialsState = [];

    forEachMaterial(mesh, (material) => {
        mesh.userData.originalMaterialsState.push({
            material,
            color: material.color ? material.color.clone() : null,
            emissive: material.emissive ? material.emissive.clone() : null,
            emissiveIntensity: typeof material.emissiveIntensity === "number"
                ? material.emissiveIntensity
                : null
        });
    });
}

function setMeshHover(mesh, active) {
    if (!mesh) return;

    prepareMeshForHover(mesh);

    mesh.userData.originalMaterialsState.forEach((state) => {
        const material = state.material;

        if (active) {
            if (material.emissive) {
                material.emissive.set(0x6aa8ff);
                material.emissiveIntensity = 2.4;
            }

            if (material.color) {
                material.color.set(0x6aa8ff);
            }
        } else {
            if (material.color && state.color) {
                material.color.copy(state.color);
            }

            if (material.emissive && state.emissive) {
                material.emissive.copy(state.emissive);
            }

            if (
                typeof material.emissiveIntensity === "number" &&
                state.emissiveIntensity !== null
            ) {
                material.emissiveIntensity = state.emissiveIntensity;
            }
        }

        material.needsUpdate = true;
    });
}

function resetHoveredMesh() {
    if (!hoveredMesh) return;

    setMeshHover(hoveredMesh, false);
    hoveredMesh = null;
}

function getObjectPath(object) {
    const names = [];
    let current = object;

    while (current) {
        if (current.name) names.unshift(current.name);
        current = current.parent;
    }

    return names.join(" > ");
}

function getMeshWorldCenter(mesh) {
    const box = new THREE.Box3().setFromObject(mesh);
    const center = new THREE.Vector3();

    if (!box.isEmpty()) {
        box.getCenter(center);
        return center;
    }

    mesh.getWorldPosition(center);
    return center;
}

function updateTooltip(event, text) {
    researchTooltip.innerText = text;
    researchTooltip.style.left = event.clientX + "px";
    researchTooltip.style.top = (event.clientY - 18) + "px";
    researchTooltip.style.opacity = "1";
    researchTooltip.style.transform = "translate(-50%, -120%)";
}

function hideTooltip() {
    researchTooltip.style.opacity = "0";
}

function resetCamera() {
    camera.position.copy(initialCameraPosition);
    controls.target.copy(initialControlsTarget);
    controls.update();
}

function focusAndOpen(pointPosition, url, cameraOffset = new THREE.Vector3(0, 0.12, 0.65)) {
    if (isFocusing) return;

    hideTooltip();
    resetHoveredMesh();

    isFocusing = true;
    focusUrl = url;

    focusPoint.copy(pointPosition);
    focusCameraPosition.copy(pointPosition).add(cameraOffset);

    researchScene.classList.add("focus-mode");
    controls.enabled = false;

    setTimeout(() => {
        fadeOverlay.style.opacity = "1";
    }, 1200);

    setTimeout(() => {
        window.open(focusUrl, "_blank");

        resetCamera();

        fadeOverlay.style.opacity = "0";
        researchScene.classList.remove("focus-mode");

        controls.enabled = true;
        isFocusing = false;
    }, 2100);
}

function registerModelMeshes() {
    allModelMeshes.length = 0;
    clickableMeshes.length = 0;

    studio.updateMatrixWorld(true);

    studio.traverse((child) => {
        if (!child.isMesh) return;

        allModelMeshes.push(child);
        prepareMeshForHover(child);

        const config = interactableMeshesConfig[child.name];

        if (config) {
            child.userData.name = config.name;
            child.userData.url = config.url;
            child.userData.cameraOffset = config.cameraOffset.clone();
            child.userData.pointPosition = getMeshWorldCenter(child);

            clickableMeshes.push(child);
        }
    });

    console.log("---- TOUS LES MESHES DU MODÈLE ----");
    console.table(
        allModelMeshes.map((mesh, index) => ({
            index,
            name: mesh.name || "(sans nom)",
            parent: mesh.parent?.name || "(sans parent)",
            material: Array.isArray(mesh.material)
                ? mesh.material.map(m => m.name).join(", ")
                : mesh.material?.name || "(sans material)"
        }))
    );

    console.log("Meshes interactives configurées :", clickableMeshes.map(mesh => mesh.name));
}

const loader = new GLTFLoader();

loader.load(
    "assets/models/home-studio.glb",

    function(gltf) {
        studio = gltf.scene;

        const box = new THREE.Box3().setFromObject(studio);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        studio.position.sub(center);
        studio.position.x = 0;

        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 3.8 / maxDim;
        studio.scale.setScalar(scale);

        studio.position.set(0, -1.1, 0);
        studio.rotation.x = 0.08;
        studio.rotation.y = -0.6;

        mainGroup.add(studio);

        registerModelMeshes();
    },

    function(xhr) {
        if (!xhr.total) return;

        console.log(
            "Chargement home studio :",
            Math.round((xhr.loaded / xhr.total) * 100) + "%"
        );
    },

    function(error) {
        console.error("Erreur chargement home studio :", error);
    }
);

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function setMousePosition(event) {
    const rect = renderer.domElement.getBoundingClientRect();

    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
}

function getRaycastTargets() {
    return DEBUG_MESH_PICKER ? allModelMeshes : clickableMeshes;
}

renderer.domElement.addEventListener("mousemove", (event) => {
    if (!studio || isFocusing) return;

    setMousePosition(event);
    raycaster.setFromCamera(mouse, camera);

    const targets = getRaycastTargets();
    const intersects = raycaster.intersectObjects(targets, true);

    const nextHoveredMesh = intersects.length > 0 ? intersects[0].object : null;

    if (nextHoveredMesh !== hoveredMesh) {
        resetHoveredMesh();

        if (nextHoveredMesh) {
            hoveredMesh = nextHoveredMesh;
            setMeshHover(hoveredMesh, true);

            console.log("MESH SURVOLÉ :", {
                name: hoveredMesh.name || "(sans nom)",
                parent: hoveredMesh.parent?.name || "(sans parent)",
                path: getObjectPath(hoveredMesh),
                material: Array.isArray(hoveredMesh.material)
                    ? hoveredMesh.material.map(m => m.name)
                    : hoveredMesh.material?.name
            });
        }
    }

    if (hoveredMesh) {
        renderer.domElement.style.cursor = "pointer";

        updateTooltip(
            event,
            hoveredMesh.userData.name || hoveredMesh.name
        );
    } else {
        renderer.domElement.style.cursor = "grab";
        hideTooltip();
    }
});

renderer.domElement.addEventListener("click", async (event) => {
    if (!studio || isFocusing) return;

    setMousePosition(event);
    raycaster.setFromCamera(mouse, camera);

    const targets = getRaycastTargets();
    const intersects = raycaster.intersectObjects(targets, true);

    if (intersects.length === 0) return;

    const object = intersects[0].object;

    if (DEBUG_MESH_PICKER) {
        const report = {
            name: object.name || "(sans nom)",
            parent: object.parent?.name || "(sans parent)",
            path: getObjectPath(object),
            material: Array.isArray(object.material)
                ? object.material.map(m => m.name)
                : object.material?.name || "(sans material)"
        };

        console.log("MESH CLIQUÉ POUR CONFIG :", report);

        try {
            await navigator.clipboard.writeText(object.name);
            updateTooltip(event, `Copié : ${object.name || "(sans nom)"}`);
        } catch {
            updateTooltip(event, `Nom : ${object.name || "(sans nom)"}`);
        }

        return;
    }

    const clickableObject = clickableMeshes.includes(object) ? object : null;

    if (!clickableObject) return;

    focusAndOpen(
        clickableObject.userData.pointPosition,
        clickableObject.userData.url,
        clickableObject.userData.cameraOffset
    );
});

renderer.domElement.addEventListener("mouseleave", () => {
    resetHoveredMesh();
    hideTooltip();
    renderer.domElement.style.cursor = "grab";
});

function animate() {
    requestAnimationFrame(animate);

    if (isFocusing) {
        camera.position.lerp(focusCameraPosition, 0.045);
        controls.target.lerp(focusPoint, 0.045);
    }

    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>

<script>
gsap.registerPlugin(ScrollTrigger);

const params = new URLSearchParams(window.location.search);
const lang = params.get("lang") || "fr";

const content = {
    fr: {
        title: "Recherche & exploration",
        intro: "Naviguez autour du modèle et cliquez sur les points lumineux pour accéder à mes écrits, supports et travaux de recherche."
    },
    en: {
        title: "Research & exploration",
        intro: "Navigate around the model and click the glowing points to access my writings, materials, and research work."
    }
};

document.getElementById("title").innerText = content[lang].title;
document.getElementById("intro").innerText = content[lang].intro;

const progress = document.getElementById("progress");

ScrollTrigger.create({
    start: 0,
    end: "max",
    onUpdate: self => {
        progress.style.width = `${self.progress * 100}%`;
    }
});

const verticalTrack = document.querySelector(".vertical-marquee-track");
const verticalItems = Array.from(verticalTrack.children);

verticalItems.forEach(item => {
    verticalTrack.appendChild(item.cloneNode(true));
});

function startVerticalMarquee() {
    const totalHeight = verticalTrack.scrollHeight / 2;

    gsap.set(verticalTrack, { y: 0 });

    gsap.to(verticalTrack, {
        y: -totalHeight,
        duration: 70,
        ease: "none",
        repeat: -1,
        modifiers: {
            y: gsap.utils.unitize(value => {
                return gsap.utils.wrap(-totalHeight, 0, parseFloat(value));
            })
        }
    });
}

window.addEventListener("load", startVerticalMarquee);

setTimeout(() => {
    document.querySelector(".vertical-marquee").classList.add("reveal");
    document.querySelector(".intro").classList.add("reveal");
    document.querySelector(".research-scene").classList.add("reveal");
}, 450);
</script>

</body>
</html>
