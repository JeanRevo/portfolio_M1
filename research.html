<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    min-height: 100%;
    background: transparent !important;
    color: white;
    font-family: 'Playfair Display', serif;
    overflow-y: auto;
}

main {
    min-height: calc(100vh - 78px);
    padding: 35px 40px 60px;
    box-sizing: border-box;
}

h1 {
    font-size: 42px;
    text-align: center;
    margin: 0 0 12px;
}

.intro {
    max-width: 780px;
    margin: 0 auto 25px;
    text-align: center;
    line-height: 1.6;
    opacity: 0.86;
    font-size: 18px;
}

.research-scene {
    position: relative;
    max-width: 1050px;
    height: 60vh;
    min-height: 460px;
    margin: auto;
    border-radius: 30px;
    background: radial-gradient(circle at center, #0f172a 0%, #020617 70%);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(10px);
    overflow: hidden;
    transition: box-shadow 0.8s ease;
}

.research-scene.focus-mode {
    box-shadow:
        0 0 80px rgba(90,170,255,0.35),
        inset 0 0 80px rgba(90,170,255,0.12);
}

#vinyl-3d {
    width: 100%;
    height: 100%;
    cursor: grab;
}

#vinyl-3d:active {
    cursor: grabbing;
}

#scene-fade {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 18%, rgba(0,0,0,0.95) 100%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease;
    z-index: 10;
}
</style>
</head>

<body>

<main>
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>

    <div class="research-scene">
        <div id="vinyl-3d"></div>
        <div id="scene-fade"></div>
    </div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const container = document.getElementById("vinyl-3d");
const fadeOverlay = document.getElementById("scene-fade");
const researchScene = document.querySelector(".research-scene");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35,
    container.clientWidth / container.clientHeight,
    0.1,
    1000
);

camera.position.set(0, 0.6, 6.5);

const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
});

renderer.setClearColor(0x000000, 0);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.enableZoom = true;
controls.minDistance = 0.8;
controls.maxDistance = 9;

scene.add(new THREE.AmbientLight(0xffffff, 3));

const keyLight = new THREE.DirectionalLight(0xffffff, 4);
keyLight.position.set(4, 6, 5);
scene.add(keyLight);

const blueLight = new THREE.PointLight(0x6aa8ff, 2.5, 10);
blueLight.position.set(-3, 2, 3);
scene.add(blueLight);

const mainGroup = new THREE.Group();
scene.add(mainGroup);

let studio = null;
const clickablePoints = [];

let isFocusing = false;
let focusPoint = new THREE.Vector3();
let focusCameraPosition = new THREE.Vector3();
let focusUrl = "";

const pointData = [
    {
        name: "Écran",
        url: "https://www.youtube.com/watch?v=ihkFPNU_wzw",
        position: new THREE.Vector3(0.0, 0.82, 0.42)
    },
    {
        name: "Clavier",
        url: "assets/pdf/recherche-1.pdf",
        position: new THREE.Vector3(-0.75, 0, 1)
    },
    {
        name: "Rack audio",
        url: "assets/pdf/recherche-2.pdf",
        position: new THREE.Vector3(0.92, 0.6, 1.6)
    }
];

function createResearchPoint(data) {
    const group = new THREE.Group();
    group.userData.isPointGroup = true;

    const sphereGeometry = new THREE.SphereGeometry(0.07, 32, 32);
    const sphereMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0x6aa8ff,
        emissiveIntensity: 3
    });

    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
    sphere.userData.url = data.url;
    sphere.userData.pointPosition = data.position.clone();

    const glowGeometry = new THREE.SphereGeometry(0.12, 32, 32);
    const glowMaterial = new THREE.MeshBasicMaterial({
        color: 0x6aa8ff,
        transparent: true,
        opacity: 0.25
    });

    const glow = new THREE.Mesh(glowGeometry, glowMaterial);

    const ringGeometry = new THREE.RingGeometry(0.13, 0.18, 40);
    const ringMaterial = new THREE.MeshBasicMaterial({
        color: 0x6aa8ff,
        transparent: true,
        opacity: 0.6,
        side: THREE.DoubleSide
    });

    const ring = new THREE.Mesh(ringGeometry, ringMaterial);

    group.add(glow);
    group.add(sphere);
    group.add(ring);

    group.position.copy(data.position);

    clickablePoints.push(sphere);
    mainGroup.add(group);
}

pointData.forEach(createResearchPoint);

const loader = new GLTFLoader();

loader.load(
    ".assets/models/home-studio.glb",

    function(gltf) {
        studio = gltf.scene;

        const box = new THREE.Box3().setFromObject(studio);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        studio.position.sub(center);
        studio.position.x = 0;

        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 3.8 / maxDim;
        studio.scale.setScalar(scale);

        studio.position.set(0, -1.1, 0);
        studio.rotation.x = 0.08;
        studio.rotation.y = -0.6;

        mainGroup.add(studio);
    },

    function(xhr) {
        console.log("Chargement home studio :", Math.round((xhr.loaded / xhr.total) * 100) + "%");
    },

    function(error) {
        console.error("Erreur chargement home studio :", error);
    }
);

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function setMousePosition(event) {
    const rect = renderer.domElement.getBoundingClientRect();

    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
}

function focusAndOpen(pointPosition, url) {
    if (isFocusing) return;

    isFocusing = true;
    focusUrl = url;

    focusPoint.copy(pointPosition);

    focusCameraPosition.set(
        pointPosition.x,
        pointPosition.y + 0.12,
        pointPosition.z + 0.65
    );

    researchScene.classList.add("focus-mode");
    controls.enabled = false;

    setTimeout(() => {
        fadeOverlay.style.opacity = "1";
    }, 1200);

    setTimeout(() => {
        window.open(focusUrl, "_blank");

        fadeOverlay.style.opacity = "0";
        researchScene.classList.remove("focus-mode");

        controls.enabled = true;
        isFocusing = false;
    }, 2100);
}

renderer.domElement.addEventListener("click", (event) => {
    setMousePosition(event);

    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(clickablePoints, true);

    if (intersects.length > 0) {
        const object = intersects[0].object;
        focusAndOpen(object.userData.pointPosition, object.userData.url);
    }
});

renderer.domElement.addEventListener("mousemove", (event) => {
    setMousePosition(event);

    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(clickablePoints, true);

    renderer.domElement.style.cursor = intersects.length > 0 ? "pointer" : "grab";
});

function animate() {
    requestAnimationFrame(animate);

    if (isFocusing) {
        camera.position.lerp(focusCameraPosition, 0.045);
        controls.target.lerp(focusPoint, 0.045);
    }

    controls.update();

    mainGroup.children.forEach(child => {
        if (child.userData.isPointGroup) {
            const glow = child.children[0];
            const ring = child.children[2];

            if (glow) {
                const scale = 1 + Math.sin(Date.now() * 0.004) * 0.2;
                glow.scale.set(scale, scale, scale);
            }

            if (ring) {
                ring.lookAt(camera.position);
                ring.rotation.z += 0.02;
            }
        }
    });

    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>

<script>
const params = new URLSearchParams(window.location.search);
const lang = params.get("lang") || "fr";

const content = {
    fr: {
        title: "Recherche & exploration",
        intro: "Naviguez autour du modèle et cliquez sur les points lumineux pour accéder à mes écrits, supports et travaux de recherche."
    },
    en: {
        title: "Research & exploration",
        intro: "Navigate around the model and click the glowing points to access my writings, materials, and research work."
    }
};

document.getElementById("title").innerText = content[lang].title;
document.getElementById("intro").innerText = content[lang].intro;
</script>

</body>
</html>
