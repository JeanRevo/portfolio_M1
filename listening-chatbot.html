<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le Studio — Listening Booth</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --paper: #F4EBD9;
    --warm-grey: #B8ADA5;
    --muted: rgba(244, 235, 217, 0.58);
    --amber: #E5C07B;
    --copper: #D98A4B;
    --red: #B94A3D;
    --glass: rgba(26, 20, 18, 0.65);
    --glass-border: rgba(229, 192, 123, 0.15);
    --deep: #070504;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    color: var(--paper);
    overflow-x: hidden;
}

body {
    font-family: "JetBrains Mono", monospace;
    background: #050403;
}

#studio-overlay {
    position: relative;
    width: 100vw;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 42px 22px;
    overflow: hidden;
}

.studio-background {
    position: fixed;
    inset: -20px;
    background-image:
        linear-gradient(
            120deg,
            rgba(0,0,0,0.55),
            rgba(35,18,10,0.25),
            rgba(0,0,0,0.66)
        ),
        url("./assets/images/music-store.jpg");
    background-size: cover;
    background-position: center;
    filter: blur(4px) brightness(0.55) saturate(1.15);
    transform: scale(1.05);
    z-index: -4;
}

.studio-background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 50% 45%, rgba(217,138,75,0.08), transparent 35%),
        radial-gradient(circle at 16% 20%, rgba(229,192,123,0.08), transparent 28%),
        linear-gradient(to bottom, rgba(0,0,0,0.18), rgba(0,0,0,0.62));
}

.studio-grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.16;
    z-index: -2;
    background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.18) 0 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.12) 0 1px, transparent 1px),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08) 0 1px, transparent 1px);
    background-size: 180px 180px, 240px 240px, 320px 320px;
    animation: grainDrift 18s linear infinite;
}

.studio-dust {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
        radial-gradient(circle, rgba(244,235,217,0.20) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(229,192,123,0.16) 0 1px, transparent 1.5px);
    background-size: 220px 220px, 360px 360px;
    background-position: 0 0, 80px 120px;
    opacity: 0.14;
    animation: dustFloat 46s linear infinite;
}

.back-link {
    position: fixed;
    top: 24px;
    left: 26px;
    color: rgba(244,235,217,0.62);
    text-decoration: none;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    z-index: 20;
    transition: color 0.35s ease;
}

.back-link:hover {
    color: var(--amber);
}

#studio-chatbot {
    position: relative;
    width: min(1080px, calc(100vw - 44px));
    min-height: 690px;
    padding: clamp(24px, 4vw, 42px);
    border-radius: 34px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
        0 45px 140px rgba(0,0,0,0.72),
        0 0 80px rgba(217,138,75,0.10),
        inset 0 0 80px rgba(229,192,123,0.045),
        inset 0 1px 0 rgba(255,255,255,0.08);
    opacity: 0;
    transform: translateY(18px) scale(0.97);
    transition:
        opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
}

#studio-chatbot.is-open {
    opacity: 1;
    transform: translateY(0) scale(1);
}

#studio-chatbot::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at top left, rgba(229,192,123,0.12), transparent 32%),
        linear-gradient(120deg, rgba(255,255,255,0.055), transparent 28%);
}

.studio-header {
    position: relative;
    display: flex;
    justify-content: space-between;
    gap: 30px;
    align-items: flex-start;
    padding-bottom: 30px;
    border-bottom: 1px solid rgba(244,235,217,0.10);
}

.studio-kicker {
    margin: 0 0 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--amber);
}

h1 {
    margin: 0;
    font-family: "Playfair Display", serif;
    font-size: clamp(58px, 9vw, 128px);
    line-height: 0.88;
    letter-spacing: -0.065em;
    font-weight: 600;
    color: var(--paper);
    text-shadow: 0 18px 50px rgba(0,0,0,0.42);
}

.studio-subtitle {
    max-width: 690px;
    margin: 24px 0 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.75;
}

.studio-status {
    font-size: 12px;
    line-height: 1.8;
    color: rgba(244,235,217,0.48);
    text-align: right;
    white-space: nowrap;
}

.studio-status span {
    color: var(--amber);
}

#studio-output {
    position: relative;
    min-height: 360px;
    max-height: 460px;
    margin-top: 30px;
    overflow-y: auto;
    padding: 26px 28px;
    border-radius: 24px;
    background:
        linear-gradient(180deg, rgba(12,9,8,0.66), rgba(5,4,4,0.78));
    border: 1px solid rgba(244,235,217,0.09);
    box-shadow:
        inset 0 0 45px rgba(0,0,0,0.35),
        0 22px 60px rgba(0,0,0,0.25);
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    line-height: 1.8;
    color: var(--warm-grey);
}

#studio-output::-webkit-scrollbar {
    width: 8px;
}

#studio-output::-webkit-scrollbar-track {
    background: rgba(255,255,255,0.04);
    border-radius: 999px;
}

#studio-output::-webkit-scrollbar-thumb {
    background: rgba(229,192,123,0.36);
    border-radius: 999px;
}

.studio-message {
    margin-bottom: 20px;
}

.studio-message.user {
    color: var(--paper);
}

.studio-message.ai {
    color: var(--warm-grey);
}

.studio-message.error {
    color: var(--red);
    animation: glitch 0.22s linear 3;
}

.studio-prefix {
    color: var(--amber);
    margin-right: 8px;
}

.studio-form {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 22px;
    padding: 18px 20px;
    border-radius: 22px;
    background: rgba(10, 8, 7, 0.66);
    border: 1px solid rgba(244,235,217,0.09);
    box-shadow:
        inset 0 0 32px rgba(0,0,0,0.28),
        0 14px 35px rgba(0,0,0,0.18);
}

#studio-input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--paper);
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
}

#studio-input::placeholder {
    color: rgba(184,173,165,0.42);
}

.studio-cursor {
    width: 8px;
    height: 20px;
    background: var(--amber);
    box-shadow: 0 0 18px rgba(229,192,123,0.6);
    animation: blink 1s steps(2, start) infinite;
}

.studio-loader {
    display: inline-flex;
    align-items: end;
    gap: 4px;
    height: 18px;
    margin-right: 10px;
}

.studio-loader span {
    width: 3px;
    background: var(--amber);
    animation: equalizer 0.75s infinite ease-in-out;
}

.studio-loader span:nth-child(1) { height: 8px; animation-delay: 0s; }
.studio-loader span:nth-child(2) { height: 14px; animation-delay: 0.12s; }
.studio-loader span:nth-child(3) { height: 10px; animation-delay: 0.24s; }
.studio-loader span:nth-child(4) { height: 18px; animation-delay: 0.36s; }

.recommendation {
    margin: 0 0 20px;
    opacity: 0;
    transform: translateY(8px);
    animation: recommendationReveal 0.45s ease forwards;
}

.recommendation-reason {
    display: block;
    margin-top: 6px;
    color: rgba(244,235,217,0.44);
    font-size: 12px;
    line-height: 1.65;
}

.recommendation-card {
    display: grid;
    grid-template-columns: 74px 1fr;
    gap: 16px;
    align-items: start;
}

.album-cover {
    width: 74px;
    height: 74px;
    border-radius: 12px;
    object-fit: cover;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(244,235,217,0.10);
    box-shadow:
        0 12px 28px rgba(0,0,0,0.35),
        0 0 24px rgba(229,192,123,0.08);
}

.album-cover.placeholder {
    display: grid;
    place-items: center;
    color: rgba(244,235,217,0.28);
    font-size: 20px;
}

.listen-links {
    display: inline-flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: 10px;
    vertical-align: middle;
}

.listen-links a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 34px;
    height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.025);
    color: rgba(244,235,217,0.68);
    text-decoration: none;
    font-size: 11px;
    line-height: 1;
    transition:
        color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        background 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.listen-links a:hover {
    background: var(--amber);
    color: #120d09;
    border-color: rgba(229,192,123,0.85);
    box-shadow: 0 0 24px rgba(229,192,123,0.28);
    transform: translateY(-1px);
}

@keyframes blink {
    50% { opacity: 0; }
}

@keyframes equalizer {
    0%, 100% { transform: scaleY(0.45); opacity: 0.45; }
    50% { transform: scaleY(1.2); opacity: 1; }
}

@keyframes glitch {
    0% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    50% { transform: translateX(3px); }
    75% { transform: translateX(-2px); }
    100% { transform: translateX(0); }
}

@keyframes recommendationReveal {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes grainDrift {
    from { transform: translate3d(0,0,0); }
    to { transform: translate3d(-120px,80px,0); }
}

@keyframes dustFloat {
    from { background-position: 0 0, 80px 120px; }
    to { background-position: 260px -380px, -140px 420px; }
}

@media (max-width: 720px) {
    #studio-overlay {
        padding: 24px 14px;
    }

    #studio-chatbot {
        width: 100%;
        min-height: auto;
        padding: 22px;
        border-radius: 26px;
    }

    .studio-header {
        flex-direction: column;
    }

    .studio-status {
        text-align: left;
    }

    h1 {
        font-size: clamp(54px, 18vw, 82px);
    }

    .studio-subtitle {
        font-size: 13px;
    }

    #studio-output {
        max-height: 380px;
        padding: 20px;
    }

    .studio-form {
        padding: 16px;
    }
}
</style>
</head>

<body>

<div id="studio-overlay">
    <div class="studio-background"></div>
    <div class="studio-grain"></div>
    <div class="studio-dust"></div>

    <a class="back-link" href="research.html">← retour scène 3D</a>

    <div id="studio-chatbot" class="is-open">
        <div class="studio-header">
            <div>
                <p class="studio-kicker">Listening Booth / Le Studio</p>
                <h1>Le Studio</h1>
                <p class="studio-subtitle">
                    Entre dans la cabine d’écoute. Indique un artiste, un morceau, un album,
                    une scène ou une humeur : Le Studio te proposera cinq pistes à explorer.
                </p>
            </div>

            <div class="studio-status">
                signal: <span>online</span><br>
                mode: gemini<br>
                archive: active
            </div>
        </div>

        <div id="studio-output"></div>

        <form id="studio-form" class="studio-form">
            <span class="studio-prefix">›</span>
            <input
                id="studio-input"
                type="text"
                autocomplete="off"
                placeholder="ex: Meryl, Jul, death metal technique, jazz nocturne..."
            >
            <span class="studio-cursor"></span>
        </form>
    </div>
</div>

<script>
const GROQ_PROXY_ENDPOINT = "https://portfolio-m1-ashy.vercel.app/api/le-studio";

const SYSTEM_PROMPT = `You are 'Le Studio', an elite music curation AI embedded in a developer's portfolio.
Your purpose is to recommend REAL music with the mindset of a passionate record store curator, musicologist, underground scene expert, and audiophile selector.

GENERAL BEHAVIOR:
The user may enter:
- an artist,
- a band,
- a stage name,
- an album,
- a track,
- a genre,
- a musical scene,
- an atmosphere,
- or a mood.

You must interpret the request intelligently and recommend musically coherent REAL music.

IMPORTANT:
Single-word inputs such as:
"Jul", "Meryl", "Death", "Phoenix", "Air", "Justice", "Opeth", "Burial"
should be interpreted as likely musical entities and NOT rejected too quickly.

FACTUAL ACCURACY:
ALL recommendations MUST reference:
- REAL artists
- REAL songs
- REAL albums
- REAL release years

Never invent:
- fake tracks,
- fake albums,
- fake release dates,
- fake collaborations,
- fake metadata.

Accuracy is more important than creativity.

LANGUAGE RULE:
1. Detect the language used by the user.
2. Respond in the SAME language as the user.
3. If the user writes in French, all recommendation reasons, clarification questions, and error messages must be written in French.
4. If the user writes in English, respond in English.
5. Preserve artist names, album titles, and track titles in their original language.

INTENT RULES:
1. If the user asks for recommendations FROM THE SAME ARTIST, you MAY recommend tracks by that same artist.
2. If the user asks for similar artists, adjacent artists, or artists in the same domain, recommend DIFFERENT artists.
3. If the user only enters an artist name with no precision, assume they want musically similar artists.
4. If the user gives a genre or scene, stay strictly inside that musical universe unless they explicitly ask for crossover or fusion.
5. If the user gives a mood or atmosphere, translate it into a coherent musical direction.

STYLISTIC PRECISION:
Preserve genre precision and avoid incorrect stylistic mixing:
- technical death metal ≠ old school death metal
- jazz fusion ≠ bebop
- cloud rap ≠ boom bap
- black metal ≠ death metal
- shoegaze ≠ dream pop
- hardcore punk ≠ metalcore

CURATORIAL RULES:
1. Favor musically credible recommendations over mainstream popularity.
2. Prioritize:
- scene relevance,
- artistic coherence,
- historical relevance,
- underground credibility,
- emotional consistency,
- sonic atmosphere.
3. Prefer meaningful discoveries over generic algorithmic recommendations.
4. Avoid repetitive recommendations across requests when possible.

REASON FIELD:
The "reason" field should briefly explain:
- stylistic proximity,
- atmosphere,
- instrumentation,
- production style,
- emotional similarity,
- historical influence,
- compositional similarity,
- or scene connection.

HOMONYM RULE:
If the input could refer to multiple artists/bands with the same or similar name, do NOT recommend yet.
Instead ask a clarification question listing possible artists with country when known.

Example:
Input: "Death"

Possible ambiguity:
- Death, death metal band, United States
- Death, proto-punk band, United States

STRICT RULES:
1. If the input is CLEARLY unrelated to music, reject it.
2. Return EXACTLY 5 recommendations for valid non-ambiguous music queries.
3. Do not recommend the exact same artist unless the user explicitly asks for that artist's songs, albums, or discography.
4. Respond STRICTLY in valid JSON.
5. Never output invalid JSON.
6. Never add explanations outside JSON.

JSON FOR VALID QUERY:
{
  "is_music": true,
  "needs_clarification": false,
  "clarification_message": null,
  "recommendations": [
    {
      "title": "...",
      "artist": "...",
      "album": "...",
      "year": "...",
      "reason": "Brève explication curatoriale cohérente."
    }
  ],
  "error_message": null
}

JSON FOR AMBIGUOUS MUSIC QUERY:
{
  "is_music": true,
  "needs_clarification": true,
  "clarification_message": "J’ai trouvé plusieurs artistes possibles pour ce nom. Lequel veux-tu dire ? 1. ... (Pays) 2. ... (Pays)",
  "recommendations": [],
  "error_message": null
}

JSON FOR NON-MUSIC QUERY:
{
  "is_music": false,
  "needs_clarification": false,
  "clarification_message": null,
  "recommendations": [],
  "error_message": "Erreur : 'Le Studio' est réservé à l’exploration musicale."
}`;

const studioOutput = document.getElementById("studio-output");
const studioForm = document.getElementById("studio-form");
const studioInput = document.getElementById("studio-input");

function escapeHTML(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function appendMessage(html, type = "ai") {
    const message = document.createElement("div");
    message.className = `studio-message ${type}`;
    message.innerHTML = html;
    studioOutput.appendChild(message);
    studioOutput.scrollTop = studioOutput.scrollHeight;
    return message;
}

function showLoadingMessage() {
    return appendMessage(`
        <span class="studio-loader">
            <span></span><span></span><span></span><span></span>
        </span>
        › Analyse des fréquences et extraction en cours...
    `, "ai");
}

function createSmartLinks(title, artist) {
    const query = encodeURIComponent(`${artist} ${title}`);

    return `
        <span class="listen-links">
            <a class="spotify" href="https://open.spotify.com/search/${query}" target="_blank" rel="noopener">SP</a>
            <a class="deezer" href="https://www.deezer.com/search/${query}" target="_blank" rel="noopener">DZ</a>
            <a class="apple" href="https://music.apple.com/search?term=${query}" target="_blank" rel="noopener">AM</a>
            <a class="tidal" href="https://listen.tidal.com/search?q=${query}" target="_blank" rel="noopener">TD</a>
            <a class="youtube" href="https://www.youtube.com/results?search_query=${query}" target="_blank" rel="noopener">YT</a>
        </span>
    `;
}

async function fetchAlbumCover(title, artist, album) {
    const queries = [
        `${artist} ${title}`,
        `${artist} ${album}`,
        `${title} ${artist}`,
        `${album} ${artist}`
    ];

    for (const q of queries) {
        try {
            const query = encodeURIComponent(q);

            const response = await fetch(
                `https://itunes.apple.com/search?term=${query}&entity=song&country=fr&limit=5`
            );

            if (!response.ok) continue;

            const data = await response.json();
            const results = data.results || [];

            const bestMatch =
                results.find(item =>
                    item.artistName?.toLowerCase().includes(artist.toLowerCase())
                ) || results[0];

            const artwork = bestMatch?.artworkUrl100;

            if (artwork) {
                return artwork
                    .replace("100x100bb.jpg", "600x600bb.jpg")
                    .replace("100x100bb.png", "600x600bb.png");
            }

        } catch {
            continue;
        }
    }

    return null;
}

async function fetchMusicRecommendations(userInput) {
    const response = await fetch(GROQ_PROXY_ENDPOINT, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            userInput,
            systemPrompt: SYSTEM_PROMPT
        })
    });

    if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText);
    }

    return await response.json();
}

async function renderRecommendations(data) {
    if (!data.is_music) {
        appendMessage(
            escapeHTML(data.error_message || "Error: Unauthorized query."),
            "error"
        );
        return;
    }

    if (data.needs_clarification) {
        appendMessage(
            escapeHTML(data.clarification_message || "Plusieurs artistes correspondent. Peux-tu préciser lequel ?"),
            "ai"
        );
        return;
    }

    const recommendations = Array.isArray(data.recommendations)
        ? data.recommendations.slice(0, 5)
        : [];

    for (const [index, item] of recommendations.entries()) {
        const number = String(index + 1).padStart(2, "0");
        const delay = index * 120;

        const coverUrl = await fetchAlbumCover(item.title, item.artist, item.album);

        const coverHTML = coverUrl
            ? `<img class="album-cover" src="${coverUrl}" alt="${escapeHTML(item.album)}">`
            : `<div class="album-cover placeholder">♪</div>`;

        const reason = item.reason
            ? `<span class="recommendation-reason">↳ ${escapeHTML(item.reason)}</span>`
            : "";

        const html = `
            <div class="recommendation" style="animation-delay:${delay}ms">
                <div class="recommendation-card">
                    ${coverHTML}

                    <div>
                        ${number}. ${escapeHTML(item.title)} — ${escapeHTML(item.artist)} — ${escapeHTML(item.album)} (${escapeHTML(item.year)})
                        <br>
                        └─ Écouter : ${createSmartLinks(item.title, item.artist)}
                        ${reason}
                    </div>
                </div>
            </div>
        `;

        appendMessage(html, "ai");
    }

    setTimeout(() => {
        appendMessage("› C’est noté. Ta sélection rejoint les archives du studio.", "ai");
    }, recommendations.length * 140 + 200);
}

studioForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const userInput = studioInput.value.trim();
    if (!userInput) return;

    appendMessage(`<span class="studio-prefix">›</span> ${escapeHTML(userInput)}`, "user");

    studioInput.value = "";
    studioInput.disabled = true;

    const loading = showLoadingMessage();

    try {
        const data = await fetchMusicRecommendations(userInput);

        loading.remove();
        await renderRecommendations(data);

    } catch (error) {
        loading.remove();
        appendMessage("Erreur système : impossible de joindre Le Studio.", "error");
        console.error("ERREUR COMPLETE :", error);
        appendMessage(escapeHTML(error.message), "error");
    } finally {
        studioInput.disabled = false;
        studioInput.focus();
    }
});

window.addEventListener("load", () => {
    appendMessage("Bienvenue dans le listening booth. Qu’est-ce que tu écoutes en ce moment ?", "ai");
    studioInput.focus();
