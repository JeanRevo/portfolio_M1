<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

<style>
:root {
    --header-safe-top: 120px;
    --blue: #7dd3fc;
    --violet: #a78bfa;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: transparent !important;
    color: white;
    font-family: 'Playfair Display', serif;
    overflow-x: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    opacity: .045;
    pointer-events: none;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='300' height='300' filter='url(%23n)'/%3E%3C/svg%3E");
}

.cursor-glow {
    position: fixed;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(125,211,252,.16), transparent 66%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 1;
    mix-blend-mode: screen;
}

.vertical-marquee {
    position: fixed;
    left: 0;
    top: 0;
    width: clamp(150px, 16vw, 250px);
    height: 100vh;
    z-index: 5;
    overflow: hidden;
    pointer-events: none;
}

.vertical-marquee-track {
    position: absolute;
    left: clamp(20px, 2.6vw, 42px);
    top: 0;
    display: flex;
    flex-direction: column;
    gap: 6vh;
    will-change: transform;
}

.vertical-marquee span {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    white-space: nowrap;
    font-size: clamp(58px, 8vw, 118px);
    line-height: .95;
    letter-spacing: -.045em;
    font-weight: 600;
    color: rgba(255,255,255,.88);
    transform: translateZ(0);
    -webkit-font-smoothing: antialiased;
    mix-blend-mode: screen;
    text-shadow: 0 0 24px rgba(0,0,0,.55);
}

.vertical-marquee span strong {
    color: transparent;
    -webkit-text-stroke: 1.4px rgba(255,255,255,.86);
    text-stroke: 1.4px rgba(255,255,255,.86);
}

main {
    position: relative;
    z-index: 2;
    min-height: 135vh;
    padding: var(--header-safe-top, 120px) 6vw 12vh 15vw;
}

.hero {
    min-height: 72vh;
    display: grid;
    grid-template-columns: .85fr 1.15fr;
    gap: 7vw;
    align-items: center;
}

.profile-orb {
    position: relative;
    width: clamp(230px, 28vw, 420px);
    aspect-ratio: 1;
    border-radius: 50%;
    margin: auto;
    opacity: 0;
    transform: translateY(32px) scale(.92);
    filter: blur(12px);
}

.profile-orb::before,
.profile-orb::after {
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18);
    animation: orbitSpin 14s linear infinite;
}

.profile-orb::after {
    inset: -34px;
    border-color: rgba(125,211,252,.22);
    animation-duration: 22s;
    animation-direction: reverse;
}

.profile-orb img {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.28);
    filter: saturate(.92) contrast(1.05);
    box-shadow:
        0 30px 90px rgba(0,0,0,.52),
        0 0 44px rgba(125,211,252,.18);
}

.profile-orb .halo {
    position: absolute;
    inset: -10%;
    border-radius: 50%;
    background:
        radial-gradient(circle at 30% 25%, rgba(125,211,252,.25), transparent 32%),
        radial-gradient(circle at 70% 70%, rgba(167,139,250,.20), transparent 36%);
    filter: blur(22px);
    opacity: .72;
    animation: haloMove 8s ease-in-out infinite alternate;
}

@keyframes orbitSpin {
    to { transform: rotate(360deg); }
}

@keyframes haloMove {
    from { transform: translate3d(-2%, -2%, 0) scale(1); }
    to { transform: translate3d(3%, 4%, 0) scale(1.08); }
}

.intro-panel {
    max-width: 660px;
}

.intro {
    font-size: clamp(22px, 3vw, 42px);
    line-height: 1.18;
    letter-spacing: -.04em;
    opacity: 0;
    transform: translateY(30px);
    filter: blur(10px);
    margin: 0;
}

.links {
    margin-top: 9vh;
    display: grid;
    grid-template-columns: repeat(4, minmax(160px, 1fr));
    gap: 22px;
}

.contact-link {
    position: relative;
    min-height: 230px;
    padding: 28px;
    border-radius: 30px;
    color: white;
    text-decoration: none;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.14);
    background:
        linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025)),
        rgba(0,0,0,.42);
    backdrop-filter: blur(15px) saturate(130%);
    -webkit-backdrop-filter: blur(15px) saturate(130%);
    opacity: 0;
    transform: translateY(40px) scale(.985);
    filter: blur(10px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition:
        background .55s ease,
        border-color .55s ease,
        box-shadow .55s ease;
}

.contact-link:nth-child(even) {
    transform: translateY(80px) scale(.985);
}

.contact-link::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(125,211,252,.22), transparent 38%);
    opacity: 0;
    transition: opacity .45s ease;
}

.contact-link::after {
    content: "";
    position: absolute;
    left: 28px;
    right: 28px;
    bottom: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(125,211,252,.65), transparent);
    opacity: 0;
    transition: opacity .45s ease;
}

.contact-link:hover {
    border-color: rgba(125,211,252,.36);
    background:
        linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.04)),
        rgba(0,0,0,.50);
    box-shadow:
        0 28px 70px rgba(0,0,0,.42),
        0 0 30px rgba(125,211,252,.15);
}

.contact-link:hover::before,
.contact-link:hover::after {
    opacity: 1;
}

.link-top,
.link-bottom {
    position: relative;
    z-index: 2;
}

.link-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.link-top svg,
.link-top img {
    width: 40px;
    height: 40px;
    object-fit: contain;
    transition: transform .45s cubic-bezier(.22,1,.36,1), filter .45s ease;
}

.contact-link:hover .link-top svg,
.contact-link:hover .link-top img {
    transform: scale(1.14) rotate(-4deg);
    filter: drop-shadow(0 0 12px rgba(125,211,252,.62));
}

.link-index {
    font-size: 12px;
    letter-spacing: .22em;
    opacity: .45;
}

.link-bottom span {
    display: block;
    font-size: clamp(28px, 4vw, 52px);
    line-height: .9;
    letter-spacing: -.055em;
}

.link-bottom small {
    display: block;
    margin-top: 12px;
    opacity: .58;
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
}

@media (max-width: 900px) {
    main {
        padding: var(--header-safe-top, 120px) 24px 90px 86px;
    }

    .vertical-marquee {
        width: 100px;
        opacity: .42;
    }

    .vertical-marquee-track {
        left: 16px;
    }

    .vertical-marquee span {
        font-size: 68px;
    }

    .hero {
        grid-template-columns: 1fr;
        gap: 56px;
    }

    .links {
        grid-template-columns: 1fr;
    }

    .contact-link:nth-child(even) {
        transform: translateY(40px) scale(.985);
    }
}
</style>
</head>

<body>

<div class="cursor-glow" id="cursorGlow"></div>

<div class="vertical-marquee" aria-hidden="true">
    <div class="vertical-marquee-track">
        <span><strong>Contact</strong> & CV</span>
        <span><strong>Contact</strong> & CV</span>
        <span><strong>Contact</strong> & CV</span>
        <span><strong>Contact</strong> & CV</span>
        <span><strong>Contact</strong> & CV</span>
        <span><strong>Contact</strong> & CV</span>
    </div>
</div>

<main>
    <section class="hero">
        <div class="profile-orb" id="profileOrb">
            <div class="halo"></div>
            <img src="assets/images/profile.jpg" alt="Briac Turquety">
        </div>

        <div class="intro-panel">
            <p class="intro" id="text"></p>
        </div>
    </section>

    <section class="links">
        <a class="contact-link magnetic-card" href="mailto:briacturquety@gmail.com">
            <div class="link-top">
                <i data-lucide="mail"></i>
                <span class="link-index">01</span>
            </div>
            <div class="link-bottom">
                <span>Email</span>
                <small>Direct message</small>
            </div>
        </a>

        <a class="contact-link magnetic-card" href="https://www.linkedin.com/in/briac-turquety-business-consultant-ia-data-student/" target="_blank">
            <div class="link-top">
                <img src="assets/logos/linkedin.png" alt="LinkedIn">
                <span class="link-index">02</span>
            </div>
            <div class="link-bottom">
                <span>LinkedIn</span>
                <small>Professional network</small>
            </div>
        </a>

        <a class="contact-link magnetic-card" href="https://github.com/JeanRevo" target="_blank">
            <div class="link-top">
                <img src="assets/logos/github.png" alt="GitHub">
                <span class="link-index">03</span>
            </div>
            <div class="link-bottom">
                <span>GitHub</span>
                <small>Code archive</small>
            </div>
        </a>

        <a class="contact-link magnetic-card" href="assets/pdf/cv-briac-t.pdf" target="_blank">
            <div class="link-top">
                <i data-lucide="file-user"></i>
                <span class="link-index">04</span>
            </div>
            <div class="link-bottom">
                <span>CV</span>
                <small>Download profile</small>
            </div>
        </a>
    </section>
</main>

<script>
gsap.registerPlugin(ScrollTrigger);

const params = new URLSearchParams(window.location.search);
const lang = params.get("lang") || "fr";

const content = {
    fr: {
        text: "Pour échanger autour d’un projet, d’une opportunité ou d’un sujet de recherche, vous pouvez me contacter ici."
    },
    en: {
        text: "To discuss a project, an opportunity, or a research topic, you can contact me here."
    }
};

document.getElementById("text").innerText = content[lang].text;

lucide.createIcons();

const lenis = new Lenis({
    lerp: 0.075,
    wheelMultiplier: .9,
    smoothWheel: true
});

lenis.on("scroll", ScrollTrigger.update);

gsap.ticker.add((time) => {
    lenis.raf(time * 1000);
});

gsap.ticker.lagSmoothing(0);

gsap.to(".vertical-marquee-track", {
    yPercent: -55,
    ease: "none",
    scrollTrigger: {
        trigger: "main",
        start: "top top",
        end: "bottom bottom",
        scrub: 1.2
    }
});

gsap.to(".profile-orb", {
    opacity: 1,
    y: 0,
    scale: 1,
    filter: "blur(0px)",
    duration: 1.35,
    ease: "power4.out",
    delay: .15
});

gsap.to(".intro", {
    opacity: .84,
    y: 0,
    filter: "blur(0px)",
    duration: 1.2,
    ease: "power4.out",
    delay: .35
});

gsap.to(".contact-link", {
    opacity: 1,
    y: 0,
    scale: 1,
    filter: "blur(0px)",
    duration: 1.15,
    ease: "power4.out",
    stagger: .11,
    delay: .65
});

gsap.to(".profile-orb img", {
    yPercent: -8,
    scale: 1.06,
    ease: "none",
    scrollTrigger: {
        trigger: ".hero",
        start: "top top",
        end: "bottom top",
        scrub: true
    }
});

const cursorGlow = document.getElementById("cursorGlow");

window.addEventListener("mousemove", e => {
    cursorGlow.style.left = `${e.clientX}px`;
    cursorGlow.style.top = `${e.clientY}px`;
});

document.querySelectorAll(".magnetic-card").forEach(card => {
    card.addEventListener("mousemove", e => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        card.style.setProperty("--x", `${x}px`);
        card.style.setProperty("--y", `${y}px`);

        const moveX = (x - rect.width / 2) * 0.025;
        const moveY = (y - rect.height / 2) * 0.035;

        gsap.to(card, {
            x: moveX,
            y: moveY,
            duration: .45,
            ease: "power3.out"
        });
    });

    card.addEventListener("mouseleave", () => {
        gsap.to(card, {
            x: 0,
            y: 0,
            duration: .7,
            ease: "elastic.out(1, .35)"
        });
    });
});

const profileOrb = document.getElementById("profileOrb");

profileOrb.addEventListener("mousemove", e => {
    const rect = profileOrb.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top - rect.height / 2;

    gsap.to(profileOrb, {
        x: x * .025,
        y: y * .025,
        rotateY: x * .015,
        rotateX: -y * .015,
        duration: .6,
        ease: "power3.out"
    });
});

profileOrb.addEventListener("mouseleave", () => {
    gsap.to(profileOrb, {
        x: 0,
        y: 0,
        rotateY: 0,
        rotateX: 0,
        duration: .8,
        ease: "elastic.out(1, .35)"
    });
});
</script>

</body>
</html>
