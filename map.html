<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Portfolio Map</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Playfair Display', serif;
    color: white;
    background: transparent;
}

video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 0;
}

.video-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1;
}

nav {
    position: fixed;
    top: 0;
    width: 100%;
    height: 78px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 26px;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(12px);
    z-index: 10;
}

nav button {
    background: none;
    border: none;
    color: white;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    opacity: 0.72;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.3s ease, transform 0.3s ease;
}

nav button:hover {
    opacity: 1;
    transform: translateY(-2px);
}

nav svg {
    width: 18px;
    height: 18px;
}

.lang-switch {
    position: fixed;
    top: 24px;
    right: 25px;
    z-index: 11;
}

.lang-switch button {
    border: none;
    padding: 6px 10px;
    cursor: pointer;
    margin-left: 5px;
}

#content-frame {
    position: fixed;
    top: 78px;
    left: 0;
    width: 100%;
    height: calc(100vh - 78px);
    border: none;
    background: transparent;
    z-index: 2;
    opacity: 1;
    transition: opacity 0.55s ease, filter 0.55s ease;
}

#content-frame.fade-out {
    opacity: 0;
    filter: blur(8px);
}

/* PLAYER */
.music-player {
    position: fixed;
    right: 24px;
    bottom: 22px;
    z-index: 12;
    padding: 14px 16px;
    min-width: 240px;
    background: rgba(0,0,0,0.48);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    color: white;
}

.player-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
}

.track-info {
    text-align: left;
    font-size: 12px;
    line-height: 1.4;
}

.track-info span:first-child {
    opacity: 0.65;
}

.track-info span:last-child {
    opacity: 0.95;
}

.player-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: grid;
    place-items: center;
    background: white;
    color: black;
}

.player-btn svg {
    width: 17px;
    height: 17px;
}

.volume-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
}

.volume-row svg {
    width: 15px;
    height: 15px;
    opacity: 0.8;
}

.volume-row input {
    width: 100%;
    accent-color: white;
}

.audio-bars {
    display: flex;
    justify-content: flex-start;
    gap: 3px;
    margin-top: 10px;
    height: 14px;
}

.audio-bars span {
    width: 3px;
    height: 5px;
    background: white;
    animation: sound 1s infinite;
}

.music-player.paused .audio-bars span {
    animation-play-state: paused;
    height: 5px;
    opacity: 0.45;
}

@keyframes sound {
    0%,100% {height:5px;}
    50% {height:14px;}
}

@media (max-width: 900px) {
    nav {
        gap: 13px;
    }

    nav button {
        font-size: 12px;
    }

    .lang-switch {
        top: 82px;
        right: 15px;
    }

    .music-player {
        right: 14px;
        bottom: 14px;
        min-width: 210px;
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<div class="lang-switch">
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('en')">EN</button>
</div>

<nav>
    <button onclick="loadPage('about.html')">
        <i data-lucide="user"></i>
        <span id="nav-about"></span>
    </button>

    <button onclick="loadPage('projects.html')">
        <i data-lucide="code-2"></i>
        <span id="nav-projects"></span>
    </button>

    <button onclick="loadPage('research.html')">
        <i data-lucide="microscope"></i>
        <span id="nav-research"></span>
    </button>

    <button onclick="loadPage('soft.html')">
        <i data-lucide="sparkles"></i>
        <span id="nav-soft"></span>
    </button>

    <button onclick="loadPage('contact.html')">
        <i data-lucide="send"></i>
        <span id="nav-contact"></span>
    </button>
</nav>

<iframe id="content-frame" src="about.html?lang=fr" allowtransparency="true"></iframe>

<div class="music-player" id="musicPlayer">
    <div class="player-top">
        <div class="track-info">
            <span>Now playing</span>
            <br>
            <span>The Landkeeper - Men I Trust</span>
        </div>

        <button class="player-btn" onclick="toggleMusic()" id="playPauseBtn">
            <i data-lucide="pause"></i>
        </button>
    </div>

    <div class="volume-row">
        <i data-lucide="volume-2"></i>
        <input type="range" min="0" max="1" step="0.01" value="0.7" oninput="setVolume(this.value)">
    </div>

    <div class="audio-bars">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<script>
let lang = "fr";

const navContent = {
    fr: {
        about: "Présentation",
        projects: "Compétences & Projets",
        research: "Recherche",
        soft: "Soft skills",
        contact: "Contact & CV"
    },
    en: {
        about: "About",
        projects: "Skills & Projects",
        research: "Research",
        soft: "Soft skills",
        contact: "Contact & CV"
    }
};

function getParentAudio() {
    return window.parent.document.getElementById("music");
}

function loadPage(page) {
    const iframe = document.getElementById("content-frame");

    iframe.classList.add("fade-out");

    setTimeout(() => {
        iframe.src = page + "?lang=" + lang;

        iframe.onload = () => {
            iframe.classList.remove("fade-out");
        };
    }, 450);
}

function setLang(l) {
    lang = l;

    document.getElementById("nav-about").innerText = navContent[lang].about;
    document.getElementById("nav-projects").innerText = navContent[lang].projects;
    document.getElementById("nav-research").innerText = navContent[lang].research;
    document.getElementById("nav-soft").innerText = navContent[lang].soft;
    document.getElementById("nav-contact").innerText = navContent[lang].contact;

    const iframe = document.getElementById("content-frame");
    const currentPage = iframe.src.split("/").pop().split("?")[0] || "about.html";

    loadPage(currentPage);
}

function toggleMusic() {
    const audio = getParentAudio();
    const player = document.getElementById("musicPlayer");
    const btn = document.getElementById("playPauseBtn");

    if (!audio) return;

    if (audio.paused) {
        audio.play();
        player.classList.remove("paused");
        btn.innerHTML = '<i data-lucide="pause"></i>';
    } else {
        audio.pause();
        player.classList.add("paused");
        btn.innerHTML = '<i data-lucide="play"></i>';
    }

    lucide.createIcons();
}

function setVolume(value) {
    const audio = getParentAudio();

    if (audio) {
        audio.volume = value;
    }
}

setLang("fr");

setTimeout(() => {
    const audio = getParentAudio();
    if (audio) audio.volume = 0.7;
}, 300);

lucide.createIcons();
</script>

</body>
</html>
